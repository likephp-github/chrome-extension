<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;width:440px;height:280px;overflow:hidden}
  body{background:linear-gradient(135deg,#4F46E5,#312E81);font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
  .head{display:flex;align-items:center;gap:14px}
  img{width:64px;height:64px}
  h1{margin:0;font-size:34px;font-weight:800;letter-spacing:-.5px;line-height:1}
  h1 small{display:block;font-size:17px;font-weight:500;opacity:.85;margin-top:6px;letter-spacing:0}
  .keys{display:flex;gap:16px}
  .key{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;opacity:.95}
  kbd{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:10px;background:#fff;color:#312E81;font:700 24px ui-monospace,Menlo,monospace;box-shadow:0 4px 0 rgba(0,0,0,.25)}
</style></head><body>
  <div class="head"><img src="../icons/icon128.png" alt=""><h1>Speed Hotkeys<small>for YouTube</small></h1></div>
  <div class="keys">
    <div class="key"><kbd>[</kbd>Slower</div>
    <div class="key"><kbd>]</kbd>Faster</div>
    <div class="key"><kbd>\</kbd>1x ⇄ last</div>
  </div>
</body></html>
